name: Build & Inject Tweak

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          cd Tweak
          make clean
          make package
          echo "Tweak built:"
          ls -la packages/

      - name: Extract IPA
        run: |
          mkdir -p build
          # Find IPA file
          IPA=$(ls *.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA found in root, checking extracted..."
            ls -la build/
          fi
          unzip -o "*.ipa" -d build/extracted/

      - name: Inject Dylib
        run: |
          # Copy the built dylib into the app
          TWEAK_DYLIB=$(ls Tweak/packages/*.deb 2>/dev/null | head -1)
          if [ -z "$TWEAK_DYLIB" ]; then
            # Direct dylib path
            cp Tweak/.theos/obj/debug/EightBPGlass.dylib build/extracted/Payload/pool.app/ 2>/dev/null || true
          fi

          # Use insert_dylib to add load command
          cd build/extracted/Payload/pool.app
          insert_dylib --inplace @executable_path/EightBPGlass.dylib pool

      - name: Repack IPA
        run: |
          cd build/extracted
          zip -r ../../8BPGlass_Modded.ipa Payload/
          echo "Modified IPA created"

      - uses: actions/upload-artifact@v4
        with:
          name: 8BPGlass_Modded.ipa
          path: 8BPGlass_Modded.ipa
